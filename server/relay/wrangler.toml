# Relais du mode duo de Passeurs : un Worker qui route chaque salle (code à 4 lettres) vers son Durable Object.
name = "passeurs-relay"
main = "src/index.js"
compatibility_date = "2026-10-01"
workers_dev = true

[[durable_objects.bindings]]
name = "ROOMS"
class_name = "Room"

# offre gratuite : seuls les Durable Objects adossés à SQLite sont disponibles
[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]
