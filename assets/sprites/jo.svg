<svg xmlns="http://www.w3.org/2000/svg" width="200" height="240" viewBox="0 0 200 240">
  <!-- Jo, Passeuse. Vue de dessus 3/4, elle regarde vers le haut (le blaster pointe en haut). Origine du corps : (100,130). -->
  <defs>
    <linearGradient id="visor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9FFFF0"/>
      <stop offset="0.55" stop-color="#3CF2D8"/>
      <stop offset="1" stop-color="#0FA897"/>
    </linearGradient>
    <linearGradient id="helm" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#D9D3C6"/>
    </linearGradient>
  </defs>
  <!-- bottes -->
  <g stroke="#0B0F1A" stroke-width="5" stroke-linejoin="round">
    <ellipse cx="72" cy="188" rx="17" ry="13" fill="#1B2B4D"/>
    <ellipse cx="128" cy="188" rx="17" ry="13" fill="#1B2B4D"/>
    <ellipse cx="72" cy="183" rx="12" ry="7" fill="#2E4470" stroke="none"/>
    <ellipse cx="128" cy="183" rx="12" ry="7" fill="#2E4470" stroke="none"/>
  </g>
  <!-- réservoirs du sac à dos (derrière, donc en bas) -->
  <g stroke="#0B0F1A" stroke-width="5" stroke-linejoin="round">
    <rect x="62" y="150" width="30" height="40" rx="14" fill="#8A939E"/>
    <rect x="108" y="150" width="30" height="40" rx="14" fill="#8A939E"/>
    <rect x="67" y="176" width="20" height="8" rx="4" fill="#3CF2D8" stroke="none"/>
    <rect x="113" y="176" width="20" height="8" rx="4" fill="#3CF2D8" stroke="none"/>
  </g>
  <!-- torse : combinaison blanche, bas plus sombre, bande orange -->
  <g stroke="#0B0F1A" stroke-width="5" stroke-linejoin="round">
    <path d="M52 100 L148 100 L142 172 L58 172 Z" fill="#F4F1EA"/>
    <path d="M55 140 L145 140 L142 172 L58 172 Z" fill="#C9C2B4" stroke="none"/>
    <path d="M52 100 L148 100 L146 120 L54 120 Z" fill="#FF7A2F" stroke="none"/>
    <path d="M94 120 L106 120 L106 172 L94 172 Z" fill="#FF7A2F" stroke="none" opacity="0.9"/>
    <path d="M52 100 L148 100 L142 172 L58 172 Z" fill="none"/>
    <!-- épaulières -->
    <ellipse cx="50" cy="106" rx="18" ry="14" fill="#FF7A2F"/>
    <ellipse cx="150" cy="106" rx="18" ry="14" fill="#FF7A2F"/>
    <ellipse cx="47" cy="102" rx="9" ry="5" fill="#FFB07A" stroke="none"/>
    <ellipse cx="147" cy="102" rx="9" ry="5" fill="#FFB07A" stroke="none"/>
  </g>
  <!-- bras tendus vers l'avant, mains sur le blaster -->
  <g stroke="#0B0F1A" stroke-width="5" stroke-linecap="round">
    <path d="M58 108 Q62 76 84 58" fill="none" stroke="#0B0F1A" stroke-width="26"/>
    <path d="M142 108 Q138 76 116 58" fill="none" stroke="#0B0F1A" stroke-width="26"/>
    <path d="M58 108 Q62 76 84 58" fill="none" stroke="#F4F1EA" stroke-width="16"/>
    <path d="M142 108 Q138 76 116 58" fill="none" stroke="#F4F1EA" stroke-width="16"/>
    <circle cx="86" cy="56" r="11" fill="#FF7A2F"/>
    <circle cx="114" cy="56" r="11" fill="#FF7A2F"/>
  </g>
  <!-- blaster -->
  <g stroke="#0B0F1A" stroke-width="5" stroke-linejoin="round">
    <rect x="88" y="14" width="24" height="58" rx="6" fill="#5A6470"/>
    <rect x="92" y="18" width="8" height="46" rx="3" fill="#8A939E" stroke="none"/>
    <rect x="84" y="8" width="32" height="16" rx="6" fill="#2C3350"/>
    <rect x="94" y="4" width="12" height="10" rx="3" fill="#3CF2D8" stroke="none"/>
    <rect x="90" y="40" width="20" height="8" rx="3" fill="#FF7A2F" stroke="none"/>
  </g>
  <!-- casque : grand dôme blanc, visière cyan à l'avant (en haut), reflets -->
  <g stroke="#0B0F1A" stroke-width="5">
    <circle cx="100" cy="110" r="46" fill="url(#helm)"/>
    <path d="M56 104 A46 46 0 0 1 144 104 Z" fill="url(#visor)" stroke="none"/>
    <path d="M56 104 L144 104" fill="none" stroke="#0B0F1A" stroke-width="5"/>
    <path d="M66 90 A40 40 0 0 1 100 70" fill="none" stroke="#FFFFFF" stroke-width="5" opacity="0.8" stroke-linecap="round"/>
    <!-- yeux derrière la visière -->
    <ellipse cx="86" cy="84" rx="5" ry="7" fill="#0B0F1A" stroke="none"/>
    <ellipse cx="114" cy="84" rx="5" ry="7" fill="#0B0F1A" stroke="none"/>
    <circle cx="88" cy="81" r="2" fill="#FFFFFF" stroke="none"/>
    <circle cx="116" cy="81" r="2" fill="#FFFFFF" stroke="none"/>
    <!-- bande orange sur le dôme et antenne -->
    <path d="M100 110 m-46 0 a46 46 0 0 0 92 0" fill="none" stroke="#FF7A2F" stroke-width="8" stroke-dasharray="0 30 60 100" opacity="0"/>
    <rect x="92" y="138" width="16" height="22" rx="4" fill="#FF7A2F"/>
    <circle cx="138" cy="128" r="7" fill="#FF7A2F"/>
  </g>
</svg>
